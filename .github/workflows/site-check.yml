# Site check: build the site, check its links and the image budget.
# Shared by all the Jekyll sites; keep the copies identical apart from the branch name.
#
#   pull requests / pushes  build + internal links (offline, fast, no flakes) + image budget
#   weekly (Monday 06:00)   the same build + external links too
#
# This only checks; deploys stay where they are (Cloudflare, GitHub Pages, Netlify).
# /api/* is skipped: those routes are Cloudflare Worker/Function endpoints, not files.
# --fallback-extensions html: /works/foo is served from works/foo.html, as on the hosts.
name: Site check

on:
  pull_request:
  push:
    branches: [gh-pages]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # latest 3.3.x: setup-ruby has no 3.3.10 build for the current ubuntu
          # runner, and .ruby-version (3.3.10) is what the hosts use
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Image budget
        env:
          IMAGE_MAX_KB: "1000" # a few PNG illustrations are 500-900 KB; lower this once they are converted
        run: |
          pip install --quiet Pillow
          python3 bin/optimize_images.py --check --max-kb ${IMAGE_MAX_KB:-500}

      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html
            --exclude 'file://.*/_site/api/'
            '_site/**/*.html'
          fail: true

      - name: External links (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200..=299,403,429
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html
            --exclude 'file://.*/_site/api/'
            '_site/**/*.html'
          fail: true
